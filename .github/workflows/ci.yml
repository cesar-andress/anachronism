name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and release gates
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Smoke tests
        run: pytest -q tests/test_rules_smoke.py tests/test_release_metadata.py

      - name: Explicit release-metadata gate
        run: python scripts/check_release_metadata.py
