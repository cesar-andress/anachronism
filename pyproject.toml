[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anachonism"
version = "1.0.1"
description = "Rule-based heuristic indicators for Spanish party ideology terms on Twitter/X (research reproduction package)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Daniel Pinto Pajares" },
  { name = "César Andrés" },
  { name = "Jose Jaime Baena Rojas" },
]
# SPDX license file pending owner/co-author authorization (see docs/LICENSE_DECISION.md).
dependencies = [
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
